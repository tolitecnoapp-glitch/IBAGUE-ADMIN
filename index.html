<style>
  *{box-sizing:border-box}

  .btn-sm{padding:6px 10px;font-size:12px}
  input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);font-size:14px}
  textarea{min-height:70px;resize:vertical}
  label{display:block;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;margin:12px 0 6px;color:var(--mut)}

  header.top small{color:var(--mut);font-size:12px}
  .tabs{display:flex;gap:6px;overflow-x:auto;padding:12px 16px 0;max-width:1100px;margin:0 auto;scrollbar-width:none}

  .tab{white-space:nowrap;background:#fff;border:1px solid var(--line)}

  main.wrap{max-width:1100px;margin:0 auto;padding:16px 16px 60px}

  .stat b{display:block;font-size:24px}
  .stat span{font-size:11px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
  .row{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:14px;background:#fff;margin-bottom:9px;flex-wrap:wrap}
  .row .grow{flex:1;min-width:160px}
  .row b{display:block;font-size:14px}
  .row small{display:block;color:var(--mut);font-size:12px;word-break:break-word}
  .av{width:48px;height:48px;border-radius:50%;object-fit:cover;background:#e9e6dc;flex:none}
  .thumb{width:72px;height:72px;border-radius:12px;object-fit:cover;background:#e9e6dc;flex:none}
  .vid{width:150px;height:86px;border-radius:10px;object-fit:cover;background:#101a30;flex:none}
  .acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .tag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.06em;padding:3px 8px;border-radius:99px;background:#eef2ff;color:#1e3a8a;text-transform:uppercase}
  .tag.ok{background:#e8f5e9;color:var(--green)}
  .tag.off{background:#fdecea;color:#b71c1c}
  .tag.y{background:#fff3cc;color:#7a5800}
  .empty{text-align:center;color:var(--mut);padding:20px;font-size:13px}
  .hint{font-size:12px;color:var(--mut);margin-top:6px}
  .lnk{text-decoration:none;color:var(--ink);padding:6px 10px;border-radius:11px;border:1px solid var(--line);font-size:12px;font-weight:700;background:#fff}
  .modal{position:fixed;inset:0;background:rgba(9,14,26,.6);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:24px 14px;overflow:auto}

  .x{position:absolute;top:10px;right:10px;background:#f3f1ec;width:34px;height:34px;padding:0;border-radius:50%;font-size:18px;line-height:1}

  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-size:13px;font-weight:700;z-index:300;max-width:92vw;box-shadow:0 14px 30px -10px rgba(0,0,0,.5);animation:up .25s ease}
  .toast.bad{background:var(--red)}
  @keyframes up{from{opacity:0;transform:translate(-50%,10px)}}
  #legacyFrame{width:100%;height:calc(100vh - 150px);min-height:560px;border:0;border-radius:18px;background:#fff;box-shadow:0 6px 0 #e0dccf,0 16px 22px -14px rgba(16,26,48,.3)}

  </section>

  <!-- COMERCIOS -->
  <section id="tab-comercios" class="tab-sec" hidden>
    <div class="card">

    </div>
  </section>

        <input id="qProds" type="search" placeholder="Buscar producto…">
        <select id="fShop"><option value="">Todos los comercios</option></select>
      </div>
      <div id="listProds"></div>
    </div>
  </section>

  <!-- BANNERS DEL HOME -->
  <section id="tab-banners" class="tab-sec" hidden>
    <div class="acts" style="margin-bottom:12px">
      <button class="btn-sm" data-sub="comercios" type="button">BANNER DE COMERCIOS</button>
      <button class="btn-sm" data-sub="home" type="button">BANNER DEL HOME</button>

      <label for="bUrl">O pegar URL (imagen o MP4)</label>

      <p class="hint">Al eliminar un banner también se borra su archivo de Storage para ahorrar espacio.</p>
    </div>
    <div class="card" id="cardListBanner" hidden>
      <h2>Banners <span id="bCount" style="font-size:12px;color:var(--mut)"></span></h2>

  <section id="tab-legado" class="tab-sec" hidden>

</main>

<header>

  <p>Administra los videos que se ven debajo del botón amarillo del clima en la app principal.</p>

<main>
  <section class="card">
    <h2 style="margin:0;font-size:16px">Agregar video</h2>
    <label for="titulo">Título</label>
    <input id="titulo" type="text" placeholder="Ej: Ibagué desde el aire">
    <label for="archivo">Subir video desde el móvil / PC (MP4)</label>
    <input id="archivo" type="file" accept="video/mp4,video/*">
    <label for="url">O pegar URL del video (MP4)</label>
    <input id="url" type="url" placeholder="https://.../video.mp4">
    <label for="poster">URL del póster / portada (opcional)</label>
    <input id="poster" type="url" placeholder="https://.../portada.jpg">
    <div class="row">
      <div>
        <label for="orden">Posición (orden)</label>
        <input id="orden" type="number" value="0" min="0">
      </div>

  </section>

  <section class="card">
    <h2 style="margin:0 0 10px;font-size:16px">Videos actuales <span id="contador" style="font-size:12px;color:#586273"></span></h2>
    <div id="lista"></div>
    <p class="msg" id="msg2"></p>
  </section>
</main>

function nombreArchivo(file) {
  const ext = (file.name.split('.').pop() || 'mp4').toLowerCase().replace(/[^a-z0-9]/g, '') || 'mp4';
  return Date.now() + '-' + Math.random().toString(36).slice(2, 8) + '.' + ext;
}

async function subirArchivo(file) {
  const nombre = nombreArchivo(file);
  const r = await fetch(STORAGE_BASE + 'object/' + BUCKET + '/' + nombre, {
    method: 'POST',
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Type': file.type || 'video/mp4', 'x-upsert': 'true' },
    body: file
  });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return STORAGE_BASE + 'object/public/' + BUCKET + '/' + nombre;
}

function rutaStorage(url) {
  const marca = '/object/public/' + BUCKET + '/';
  const i = (url || '').indexOf(marca);
  if (i === -1) return null;
  return decodeURIComponent(url.slice(i + marca.length).split('?')[0]);
}

async function borrarArchivoStorage(url) {
  const ruta = rutaStorage(url);
  if (!ruta) return;
  try {
    await fetch(STORAGE_BASE + 'object/' + BUCKET + '/' + ruta, {
      method: 'DELETE',
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
    });
  } catch (e) {}
}

async function agregar() {
  const titulo = $('titulo').value.trim();
  let url = $('url').value.trim();
  const poster = $('poster').value.trim();
  const orden = Number($('orden').value || 0);
  const activo = $('activo').value === 'true';
  const archivo = $('archivo').files && $('archivo').files[0];
  if (!url && !archivo) { avisar(msg, 'Elige un archivo del móvil o pega la URL del video (MP4).', false); return; }
  avisar(msg, archivo ? 'Subiendo video…' : 'Guardando…', true);
  try {
    if (archivo) url = await subirArchivo(archivo);
    const r = await fetch(SUPABASE_URL + TABLA, {
      method: 'POST',
      headers: headers(true),
      body: JSON.stringify({ titulo: titulo || 'Video destacado', video_url: url, poster_url: poster || null, orden, activo })
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    $('titulo').value = ''; $('url').value = ''; $('poster').value = ''; $('archivo').value = '';
    avisar(msg, 'Video agregado. Ya se ve en la app.', true);
    cargar();
  } catch (e) {
    avisar(msg, 'No se pudo guardar. Revisa el archivo/URL y los permisos (RLS + Storage).', false);
  }
}

async function eliminar(v) {
  if (!confirm('¿Eliminar "' + (v.titulo || 'video') + '"? También se borrará el archivo de Supabase para ahorrar espacio.')) return;
  try {
    const r = await fetch(SUPABASE_URL + TABLA + '?id=eq.' + encodeURIComponent(v.id), { method: 'DELETE', headers: headers(false) });

async function alternar(v) {

    if (!r.ok) throw new Error('HTTP ' + r.status);
    cargar();

}

const esInstalada = () =>

const esIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) ||
  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

function mostrarInstalacion() {
  if (esInstalada()) return;
  installOverlay.hidden = false;
  void installOverlay.offsetWidth;
  installOverlay.classList.add('is-open');
  document.documentElement.style.overflow = 'hidden';
  installYes.focus({ preventScroll: true });
}

function ocultarInstalacion() {
  installOverlay.classList.remove('is-open');
  setTimeout(() => {
    installOverlay.hidden = true;
    document.documentElement.style.overflow = '';
  }, 260);
}

  deferredPrompt = e;
});

});

}

/* Ruta de un archivo en Storage a partir de su URL pública */
function storageRef(url) {
  if (!url || typeof url !== 'string') return null;
  const m = url.match(/\/storage\/v1\/object\/(?:public|sign)\/([^/]+)\/([^?#]+)/);
  if (!m) return null;
  return { bucket: m[1], path: decodeURIComponent(m[2]) };
}
async function borrarArchivo(url) {
  const r = storageRef(url);
  if (!r) return;
  try {
    const { error } = await sb.storage.from(r.bucket).remove([r.path]);
    if (error) toast('No se pudo borrar el archivo de Storage: ' + error.message, false);
  } catch (e) {
    toast('No se pudo borrar el archivo de Storage', false);
  }
}
async function subirArchivo(bucket, file, prefix) {
  const ext = (file.name.split('.').pop() || 'bin').toLowerCase().replace(/[^a-z0-9]/g, '') || 'bin';
  const name = `${prefix}-${Date.now()}-${Math.random().toString(36).slice(2, 7)}.${ext}`;
  const { error } = await sb.storage.from(bucket).upload(name, file, { upsert: true, contentType: file.type || undefined, cacheControl: '31536000' });
  if (error) throw error;
  return sb.storage.from(bucket).getPublicUrl(name).data.publicUrl;
}
/* Reduce el peso de las imágenes antes de subirlas (más rápido para la app) */
function comprimirImagen(file, max = 900) {
  if (file.type === 'image/gif' || !file.type.startsWith('image/')) return Promise.resolve(file);
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onerror = rej;
    r.onload = e => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if (Math.max(w, h) > max) { const k = max / Math.max(w, h); w = Math.round(w * k); h = Math.round(h * k); }
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        c.toBlob(b => b ? res(new File([b], 'img.jpg', { type: 'image/jpeg' })) : rej(new Error('No se pudo procesar la imagen')), 'image/jpeg', 0.86);
      };
      img.onerror = rej;
      img.src = e.target.result;
    };
    r.readAsDataURL(file);
  });
}
function imgsDe(p) {
  let arr = [];

  if (p.image_url && !arr.includes(p.image_url)) arr.unshift(p.image_url);
  return arr.filter(Boolean).slice(0, 4);
}

      <div class="grow">
        <b>${esc(s.name || 'Sin nombre')}</b>
        <small>${esc(s.category || 'Sin categoría')} · Dueño: ${esc(ownerName(s.owner_id))}</small>
        <small>Productos: ${productsOf(s).length} · Tema: ${esc(s.theme || 'light')} · Alta: ${fecha(s.created_at)}</small>
        <div class="acts" style="margin-top:6px">
          ${s.video ? '<span class="tag ok">Video</span>' : '<span class="tag">Sin video</span>'}
          ${s.logo ? '<span class="tag ok">Logo</span>' : '<span class="tag off">Sin logo</span>'}
        </div>
      </div>
      <div class="acts">
        <button class="btn-sm btn-y" data-act="edit-shop" data-id="${s.id}" type="button">Editar</button>
        <button class="btn-sm btn-red" data-act="del-shop" data-id="${s.id}" type="button">Eliminar</button>
      </div>
    </div>`;
  }).join('') : '<p class="empty">No hay comercios con ese criterio.</p>';
}
$$('qShops').addEventListener('input', renderComercios);

function editarComercio(id) {
  const s = S.shops.find(x => String(x.id) === String(id));
  if (!s) return;
  const owners = S.users.map(u => `<option value="${u.id}" ${u.id === s.owner_id ? 'selected' : ''}>${esc(u.full_name || u.email || u.id)} (${u.role})</option>`).join('');
  openModal(`
    <h2>Editar comercio</h2>
    <p class="hint" style="margin-top:0">${esc(s.name)} · ID ${esc(shopKey(s))}</p>
    <form id="mForm">
      <div class="grid2">
        <div><label>Nombre</label><input name="name" required value="${esc(s.name)}"></div>
        <div><label>Categoría</label><input name="category" value="${esc(s.category)}"></div>
      </div>
      <label>Descripción</label><textarea name="description">${esc(s.description)}</textarea>
      <div class="grid2">
        <div><label>WhatsApp</label><input name="whatsapp" value="${esc(s.whatsapp)}"></div>
        <div><label>Teléfono</label><input name="phone" value="${esc(s.phone)}"></div>
      </div>
      <label>Dirección</label><input name="address" value="${esc(s.address)}">
      <div class="grid2">
        <div><label>Facebook</label><input name="facebook_link" value="${esc(s.facebook_link)}"></div>
        <div><label>Instagram</label><input name="instagram_link" value="${esc(s.instagram_link)}"></div>
      </div>
      <label>TikTok</label><input name="tiktok_link" value="${esc(s.tiktok_link)}">
      <div class="grid2">
        <div><label>Color principal</label><input name="primary_color" type="color" value="${/^#[0-9a-f]{6}$/i.test(s.primary_color || '') ? s.primary_color : '#F2BA17'}" style="height:44px;padding:4px"></div>
        <div><label>Tema</label><select name="theme"><option value="light" ${s.theme !== 'dark' ? 'selected' : ''}>Claro</option><option value="dark" ${s.theme === 'dark' ? 'selected' : ''}>Oscuro</option></select></div>
      </div>
      <div class="grid2">
        <div><label>Valor del domicilio</label><input name="delivery_fee" type="number" min="0" value="${Number(s.delivery_fee || 0)}"></div>
        <div><label>Dueño (vendedor)</label><select name="owner_id"><option value="">Sin dueño</option>${owners}</select></div>
      </div>
      <div class="grid2">
        <div><label>Título productos</label><input name="products_title" value="${esc(s.products_title)}"></div>
        <div><label>Título servicios</label><input name="services_title" value="${esc(s.services_title)}"></div>
      </div>
      <label>Logo actual</label>
      <div class="acts"><img class="thumb" src="${esc(s.logo || '')}" alt="" onerror="this.style.visibility='hidden'"></div>
      <label>Reemplazar logo</label><input name="logo" type="file" accept="image/*">
      <label>Video actual</label>
      ${s.video ? `<video class="vid" src="${esc(s.video)}" muted controls preload="metadata" style="width:100%;max-width:300px;height:auto"></video>` : '<p class="hint">Sin video.</p>'}
      <label>Reemplazar video (máx. 25 MB)</label><input name="video" type="file" accept="video/*">
      ${s.video ? '<label class="check"><input name="quitar_video" type="checkbox"> Quitar video</label>' : '<input name="quitar_video" type="checkbox" hidden>'}
      <button class="btn-y" type="submit" id="mSave" style="width:100%;margin-top:16px">GUARDAR CAMBIOS</button>
    </form>`);
  $$('mForm').addEventListener('submit', e => guardarComercio(e, s));
}

async function guardarComercio(e, s) {
  e.preventDefault();
  const f = e.target, btn = $$('mSave');
  const v = n => f.elements[n].value.trim();
  const payload = {
    name: v('name'), category: v('category'), description: v('description'),
    whatsapp: v('whatsapp'), phone: v('phone'), address: v('address'),
    facebook_link: v('facebook_link'), instagram_link: v('instagram_link'), tiktok_link: v('tiktok_link'),
    primary_color: v('primary_color') || '#F2BA17', theme: v('theme'),
    delivery_fee: Number(v('delivery_fee') || 0),
    products_title: v('products_title'), services_title: v('services_title'),
    owner_id: v('owner_id') || null
  };
  const logoFile = f.elements.logo.files[0];
  const vidFile = f.elements.video.files[0];
  const quitar = f.elements.quitar_video.checked;
  btn.disabled = true; btn.textContent = 'Guardando…';
  try {
    if (logoFile) payload.logo = await subirArchivo('logos', await comprimirImagen(logoFile, 600), 'logo-' + s.id);
    if (vidFile) {
      if (vidFile.size > 25 * MB) throw new Error('El video supera 25 MB');
      payload.video = await subirArchivo('videos', vidFile, 'video-' + s.id);
    } else if (quitar) payload.video = null;
    const { error } = await sb.from('shops').update(payload).eq('id', s.id);
    if (error) throw error;
    if (s.logo && payload.logo && payload.logo !== s.logo) await borrarArchivo(s.logo);
    if (s.video && payload.video !== undefined && payload.video !== s.video) await borrarArchivo(s.video);
    closeModal();
    toast('Comercio actualizado');
    await cargarTodo();
  } catch (err) {
    toast('Error: ' + (err.message || err), false);
    btn.disabled = false; btn.textContent = 'GUARDAR CAMBIOS';
  }
}

async function borrarComercio(id) {
  const s = S.shops.find(x => String(x.id) === String(id));
  if (!s) return;
  if (!confirm(`¿Eliminar "${s.name}" con todos sus productos, categorías, reseñas, banners, logo y video? Esta acción no se puede deshacer.`)) return;
  const k = shopKey(s);
  try {
    for (const p of productsOf(s)) for (const u of imgsDe(p)) await borrarArchivo(u);
    for (const b of S.banners.filter(b => b.business_id === k)) await borrarArchivo(b.video_url || b.image_url || b.media_url);
    await sb.from('shop_products').delete().in('business_id', [k, String(s.id)]);
    await sb.from('shop_categories').delete().eq('business_id', k);
    await sb.from('shop_reviews').delete().eq('business_id', k);
    await sb.from('shop_banners').delete().eq('business_id', k);
    const { error } = await sb.from('shops').delete().eq('id', s.id);
    if (error) throw error;
    if (s.logo) await borrarArchivo(s.logo);
    if (s.video) await borrarArchivo(s.video);
    toast('Comercio eliminado');
    await cargarTodo();
  } catch (err) { toast('No se pudo eliminar: ' + (err.message || err), false); }
}

/* ==========================================================
   PRODUCTOS
   ========================================================== */
function renderProductos() {
  const sel = $$('fShop');
  const actual = sel.value;
  sel.innerHTML = '<option value="">Todos los comercios</option>' +
    S.shops.map(s => `<option value="${esc(shopKey(s))}">${esc(s.name)}</option>`).join('');
  sel.value = actual;
  const q = norm($$('qProds').value);
  const f = sel.value;
  const list = S.products.filter(p => (!f || String(p.business_id) === f) &&
    (!q || norm([p.name, p.category, p.description].join(' ')).includes(q)));
  $$('listProds').innerHTML = list.length ? list.map(p => {
    const sh = shopOf(p);
    const st = p.stock === null || p.stock === undefined ? 'Sin control' : p.stock + ' disp.';
    const img = imgsDe(p)[0] || '';
    return `<div class="row">
      <img class="thumb" src="${esc(img)}" loading="lazy" decoding="async" alt="" onerror="this.style.visibility='hidden'">
      <div class="grow">
        <b>${esc(p.name)}</b>
        <small>${esc(sh ? sh.name : 'Comercio desconocido')} · ${esc(p.category || 'General')}</small>
        <small>${money(p.price)} · ${esc(p.item_type === 'servicio' ? 'Servicio' : 'Producto')} · Stock: ${esc(st)} · Fotos: ${imgsDe(p).length}</small>
      </div>
      <div class="acts">
        <button class="btn-sm btn-y" data-act="edit-prod" data-id="${p.id}" type="button">Editar</button>
        <button class="btn-sm btn-red" data-act="del-prod" data-id="${p.id}" type="button">Eliminar</button>
      </div>
    </div>`;
  }).join('') : '<p class="empty">No hay productos con ese criterio.</p>';
}
$$('qProds').addEventListener('input', renderProductos);
$$('fShop').addEventListener('change', renderProductos);

function renderImgsEdit() {
  $$('pImgs').innerHTML = EDIT_IMGS.map((u, i) => `
    <div class="it"><img src="${esc(u)}" alt="" loading="lazy" decoding="async">
      <button type="button" data-act="quitar-img" data-id="${i}" aria-label="Quitar">✕</button></div>`).join('') || '<p class="hint">Sin fotos.</p>';
}

function editarProducto(id) {
  const p = S.products.find(x => String(x.id) === String(id));
  if (!p) return;
  EDIT_IMGS = imgsDe(p);
  const cats = [...new Set(S.products.map(x => x.category).filter(Boolean).concat([p.category || 'General']))];
  openModal(`
    <h2>Editar producto</h2>
    <p class="hint" style="margin-top:0">${esc(shopOf(p) ? shopOf(p).name : '')}</p>
    <form id="mForm">
      <label>Nombre</label><input name="name" required value="${esc(p.name)}">
      <div class="grid2">
        <div><label>Precio</label><input name="price" type="number" min="0" step="0.01" required value="${Number(p.price || 0)}"></div>
        <div><label>Stock (vacío = sin control)</label><input name="stock" type="number" min="0" step="1" value="${p.stock ?? ''}"></div>
      </div>
      <div class="grid2">
        <div><label>Categoría</label><input name="category" list="catList" value="${esc(p.category || 'General')}"><datalist id="catList">${cats.map(c => `<option value="${esc(c)}">`).join('')}</datalist></div>
        <div><label>Tipo</label><select name="item_type"><option value="producto" ${p.item_type !== 'servicio' ? 'selected' : ''}>Producto</option><option value="servicio" ${p.item_type === 'servicio' ? 'selected' : ''}>Servicio</option></select></div>
      </div>
      <label>Descripción</label><textarea name="description">${esc(p.description)}</textarea>
      <label>Fotos (máximo 4; la primera es la principal)</label>
      <div class="imgs" id="pImgs"></div>
      <label>Agregar fotos</label><input name="nuevas" type="file" accept="image/*" multiple>
      <button class="btn-y" type="submit" id="mSave" style="width:100%;margin-top:16px">GUARDAR PRODUCTO</button>
    </form>`);
  renderImgsEdit();
  $$('mForm').addEventListener('submit', e => guardarProducto(e, p));
}

async function guardarProducto(e, p) {
  e.preventDefault();
  const f = e.target, btn = $$('mSave');
  btn.disabled = true; btn.textContent = 'Guardando…';
  try {
    const nuevas = Array.from(f.elements.nuevas.files || []);
    const espacio = 4 - EDIT_IMGS.length;
    const subidas = [];
    for (const file of nuevas.slice(0, Math.max(0, espacio))) {
      subidas.push(await subirArchivo('logos', await comprimirImagen(file, 960), 'prod-' + p.id));
    }
    const finales = EDIT_IMGS.concat(subidas).slice(0, 4);
    const quitadas = imgsDe(p).filter(u => !finales.includes(u));
    const v = n => f.elements[n].value.trim();
    const payload = {
      name: v('name'), price: Number(v('price') || 0),
      stock: v('stock') === '' ? null : Math.max(0, parseInt(v('stock'), 10) || 0),
      category: v('category') || 'General', item_type: v('item_type'), description: v('description'),
      images: JSON.stringify(finales), image_url: finales[0] || ''
    };
    const { error } = await sb.from('shop_products').update(payload).eq('id', p.id);
    if (error) throw error;
    for (const u of quitadas) await borrarArchivo(u);
    closeModal();
    toast('Producto actualizado');
    await cargarTodo();
  } catch (err) {
    toast('Error: ' + (err.message || err), false);
    btn.disabled = false; btn.textContent = 'GUARDAR PRODUCTO';
  }
}

async function borrarProducto(id) {
  const p = S.products.find(x => String(x.id) === String(id));
  if (!p) return;
  if (!confirm(`¿Eliminar "${p.name}" y sus fotos?`)) return;
  const { error } = await sb.from('shop_products').delete().eq('id', p.id);
  if (error) return toast('No se pudo eliminar: ' + error.message, false);
  for (const u of imgsDe(p)) await borrarArchivo(u);
  toast('Producto eliminado');
  await cargarTodo();
}

/* ==========================================================
   BANNERS DEL HOME (lo que se ve en el banner de index.html)
   ========================================================== */
let bView = 'home';
function fillBannerShops() {
  const sel = $$('fBannerShop');
  const actual = sel.value;
  sel.innerHTML = '<option value="">Todos los comercios</option>' +
    S.shops.map(s => `<option value="${esc(shopKey(s))}">${esc(s.name)}</option>`).join('');
  sel.value = actual;
}
$$('fBannerShop').addEventListener('change', () => renderBanners());
function setBView(v) {
  bView = v;
  document.querySelectorAll('[data-sub]').forEach(x => x.classList.toggle('btn-y', x.dataset.sub === v));
  $$('cardListBanner').hidden = false;
  renderBanners();
}
document.querySelectorAll('[data-sub]').forEach(b => b.addEventListener('click', () => setBView(b.dataset.sub)));
function renderBanners() {
  const home = S.banners.filter(isHome);
  const otros = S.banners.filter(b => !isHome(b));
  $$('cardAddBanner').hidden = bView !== 'home';
  $$('barShop').hidden = bView !== 'comercios';
  if (bView === 'comercios') fillBannerShops();
  const fShop = $$('fBannerShop').value;
  const base = bView === 'home' ? home : otros.filter(b => !fShop || String(b.business_id) === fShop);
  $$('bCount').textContent = `(${base.length})`;
  const fila = b => {
    const url = b.video_url || b.image_url || b.media_url || '';
    const esVideo = !!b.video_url || b.media_type === 'video' || /\.(mp4|webm|mov)(\?|$)/i.test(url);
    const media = esVideo
      ? `<video class="vid" src="${esc(url)}" muted loop playsinline preload="metadata"></video>`
      : `<img class="vid" src="${esc(url)}" loading="lazy" decoding="async" alt="">`;
    const estado = isHome(b)
      ? (isHidden(b) ? '<span class="tag off">Oculto</span>' : '<span class="tag ok">Visible en el home</span>')
      : '<span class="tag y">Banner de comercio</span>';
    const boton = isHome(b)
      ? `<button class="btn-sm" data-act="toggle-banner" data-id="${b.id}" type="button">${isHidden(b) ? 'Mostrar' : 'Ocultar'}</button>`
      : '';
    const comercio = !isHome(b) ? (shopByBid(b.business_id) ? shopByBid(b.business_id).name : b.business_id) : '';
    return `<div class="row">
      ${media}
      <div class="grow">
        <b>${esc(b.title || 'Sin título')}</b>
        ${estado} <span class="tag">${esVideo ? 'Video' : 'Imagen'}</span>
        <small>Alta: ${fecha(b.created_at)} ${comercio ? '· Comercio: ' + esc(comercio) : ''}</small>
        ${isHome(b) ? `<div class="acts" style="margin-top:6px">
          <label style="margin:0;display:flex;gap:6px;align-items:center;font-size:11px;text-transform:none;letter-spacing:0">Posición
            <input id="ord-${b.id}" type="number" min="0" value="${b.order_index ?? 0}" style="width:70px;padding:6px 8px"></label>
          <button class="btn-sm" data-act="save-order" data-id="${b.id}" type="button">Guardar</button>
        </div>` : ''}
      </div>
      <div class="acts">
        ${boton}
        <button class="btn-sm btn-red" data-act="del-banner" data-id="${b.id}" type="button">Eliminar</button>
      </div>
    </div>`;
  };
  $$('listBanners').innerHTML = base.length
    ? base.map(fila).join('')
    : '<p class="empty">No hay banners en esta sección.</p>';
}

$$('btnAddBanner').addEventListener('click', async () => {
  const btn = $$('btnAddBanner');
  const titulo = $$('bTitulo').value.trim();
  const orden = Number($$('bOrden').value || 0);
  const visible = $$('bVisible').value === 'true';
  const file = $$('bArchivo').files[0];
  const url = $$('bUrl').value.trim();
  if (!file && !url) return toast('Elige un archivo o pega una URL', false);
  btn.disabled = true; btn.textContent = 'Subiendo…';
  try {
    let media = url;
    let tipo = /\.(mp4|webm|mov)(\?|$)/i.test(url) ? 'video' : 'image';
    if (file) {
      tipo = file.type.startsWith('video/') ? 'video' : 'image';
      if (tipo === 'video' && file.size > 25 * MB) throw new Error('El video supera 25 MB');
      const blob = tipo === 'image' ? await comprimirImagen(file, 1280) : file;
      media = await subirArchivo(tipo === 'video' ? 'videos' : 'logos', blob, 'banner');
    }
    const row = { business_id: visible ? null : HIDDEN_TAG, title: titulo || null, media_url: media, media_type: tipo, order_index: orden };
    if (tipo === 'video') row.video_url = media; else row.image_url = media;
    const { error } = await sb.from('shop_banners').insert([row]);
    if (error) throw error;
    $$('bTitulo').value = ''; $$('bUrl').value = ''; $$('bArchivo').value = '';
    toast('Banner agregado');
    await cargarTodo();
  } catch (err) {
    toast('Error: ' + (err.message || err), false);
  } finally {
    btn.disabled = false; btn.textContent = 'AGREGAR BANNER';
  }
});

async function alternarBanner(id) {
  const b = S.banners.find(x => String(x.id) === String(id));
  if (!b) return;
  const nuevo = isHidden(b) ? null : HIDDEN_TAG;
  const { error } = await sb.from('shop_banners').update({ business_id: nuevo }).eq('id', b.id);
  if (error) return toast('No se pudo cambiar: ' + error.message, false);
  toast(nuevo ? 'Banner oculto en la app' : 'Banner visible en la app');
  await cargarTodo();
}
async function guardarOrdenBanner(id) {
  const val = Math.max(0, Number($$('ord-' + id).value || 0));
  const { error } = await sb.from('shop_banners').update({ order_index: val }).eq('id', id);
  if (error) return toast('No se pudo guardar: ' + error.message, false);
  toast('Posición guardada');
  await cargarTodo();
}
async function borrarBanner(id) {
  const b = S.banners.find(x => String(x.id) === String(id));
  if (!b) return;
  if (!confirm('¿Eliminar este banner? También se borrará su archivo.')) return;
  const { error } = await sb.from('shop_banners').delete().eq('id', b.id);
  if (error) return toast('No se pudo eliminar: ' + error.message, false);
  await borrarArchivo(b.video_url || b.image_url || b.media_url);
  toast('Banner eliminado');
  await cargarTodo();
}

/* ==========================================================
   ACCIONES DELEGADAS
   ========================================================== */
const ACCIONES = {
  'edit-user': editarUsuario,
  'del-user': borrarUsuario,
  'edit-shop': editarComercio,
  'del-shop': borrarComercio,
  'edit-prod': editarProducto,
  'del-prod': borrarProducto,
  'toggle-banner': alternarBanner,
  'save-order': guardarOrdenBanner,
  'del-banner': borrarBanner,
  'quitar-img': i => { EDIT_IMGS.splice(Number(i), 1); renderImgsEdit(); }
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || !ACCIONES[b.dataset.act]) return;
  ACCIONES[b.dataset.act](b.dataset.id);
});

/* ==========================================================
   INICIO (sin contraseña: acceso directo del administrador)
   ========================================================== */
cargarTodo();
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
